[toolchain]

[features]
seeds = false
skip-lint = false

[programs.localnet]
apexyield_core = "ApexYieLd11111111111111111111111111111111111"

[programs.devnet]
apexyield_core = "ApexYieLd11111111111111111111111111111111111"

[programs.mainnet]
apexyield_core = "ApexYieLd11111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
